<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Profissional 🚀</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    p {
      font-size: 16px;
      margin-bottom: 30px;
      color: #555;
    }
    .google-btn {
      margin-top: 20px;
      cursor: pointer;
    }
    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }
    .footer a {
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ Bem-vindo ao Nosso Sistema ✨</h1>
    <p>Faça login com sua conta do Google para continuar:</p>
    <div class="google-btn" id="google-login"></div>
    <div class="footer">
      Precisa de ajuda? Entre em contato conosco via 📧 <a href="mailto:suporte@exemplo.com">suporte@exemplo.com</a>.
    </div>
  </div>

  <script>
    function handleCredentialResponse(response) {
      // Armazena o token JWT no localStorage
      const idToken = response.credential;
      localStorage.setItem('googleToken', idToken);

      // Redireciona para o menu após o login
      window.location.href = 'menu.html';
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: '74041235572-7fdjgonas2t5rmvuh7ckf0aspqg2k656.apps.googleusercontent.com', // Substituído pelo seu Client ID
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById('google-login'),
        {
          theme: 'outline',
          size: 'large',
          type: 'standard',
          text: 'signin_with',
          shape: 'rectangular',
          logo_alignment: 'left'
        }
      );
    };
  </script>
</body>
</html>
